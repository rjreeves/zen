[package]
name = "zen-runtime"
version = "0.1.0"
edition = "2021"
description = "Zen workflow engine runtime: permissions, process exec, and workflow execution, decoupled from the .fg interpreter"
license = "MIT"

[dependencies]
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }
sysinfo = "0.30"
