[package]
name = "zen"
version = "1.0.3"
edition = "2021"
description = "Zen - Windows-first scripting CLI with typed pipelines and permissions"
license = "MIT"
authors = ["Your Name <you@example.com>"]
repository = "https://github.com/yourname/zen"

[dependencies]
# CLI args
clap = { version = "4.5", features = ["derive"] }

# JSON for audit logs + http.get output
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }

# HTTP client (simple sync)
ureq = "2.9"

# Windows process listing (optional)
sysinfo = "0.30"

# Path handling & dirs
dirs = "5.0"

# Nice error messages (optional but helpful)
thiserror = "1.0"

chrono = { version = "0.4", features = ["clock"] }

# Logging (optional)
log = "0.4"
env_logger = "0.11"

# Hashing for Dropbox-compatible content hashes
ring = "0.17"

# REPL line editing and persistent history
reedline = "0.47"
zip = "0.6"

[build-dependencies]
chrono = { version = "0.4", features = ["clock"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
