[package]
name = "zen"
version = "0.1.0"
edition = "2021"
description = "ForgeCLI - Windows-first scripting CLI with typed pipelines and permissions"
license = "MIT"
authors = ["Your Name <you@example.com>"]
repository = "https://github.com/yourname/forgecli"

[dependencies]
# CLI args
clap = { version = "4.5", features = ["derive"] }

# JSON for audit logs + http.get output
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client (simple sync for v0.1)
ureq = "2.9"

# Windows process listing (optional)
sysinfo = "0.30"

# Path handling & dirs (~/.forge)
dirs = "5.0"

# Nice error messages (optional but helpful)
thiserror = "1.0"

chrono = { version = "0.4", features = ["clock"] }

# Logging (optional)
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true