name = "scheduler"
description = "Wraps Windows Task Scheduler commands through schtasks."
version = "0.1.0"
author = "Zen workspace"

[[commands]]
name = "scheduler.tasks"
run = "schtasks /Query /FO LIST"
summary = "Lists scheduled tasks in detailed text form."
usage = "scheduler.tasks"
examples = ["scheduler.tasks", "scheduler.tasks | get stdout"]

[[commands]]
name = "scheduler.tasks.table"
run = "schtasks /Query /FO TABLE"
summary = "Lists scheduled tasks in table form."
usage = "scheduler.tasks.table"
examples = ["scheduler.tasks.table", "scheduler.tasks.table | get stdout"]

[[commands]]
name = "scheduler.tasks.json"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File .zen\\plugins\\scheduler\\tasks-json.ps1"
summary = "Lists scheduled tasks as a JSON envelope."
usage = "scheduler.tasks.json"
examples = ["scheduler.tasks.json | get stdout | from-json | table", "scheduler.tasks.json | get stdout | save \".zen/schedules.json\""]

[[commands]]
name = "scheduler.store"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File .zen\\plugins\\scheduler\\store.ps1"
summary = "Stores the current scheduled task snapshot as .zen/schedules.json."
usage = "scheduler.store"
examples = ["scheduler.store", "workspace.read \".zen/schedules.json\" | from-json | table"]

[[commands]]
name = "scheduler.task"
run = "schtasks /Query /TN"
summary = "Shows one scheduled task by name."
usage = "scheduler.task <task-name>"
examples = ["scheduler.task \"\\Microsoft\\Windows\\Defrag\\ScheduledDefrag\""]

[[commands]]
name = "scheduler.exists"
run = "schtasks /Query /TN"
summary = "Checks whether one scheduled task exists by querying it."
usage = "scheduler.exists <task-name>"
examples = ["scheduler.exists \"MyTask\""]

[[commands]]
name = "scheduler.run"
run = "schtasks /Run /TN"
summary = "Runs one scheduled task by name."
usage = "scheduler.run <task-name>"
examples = ["scheduler.run \"MyTask\""]

[[commands]]
name = "scheduler.enable"
run = "schtasks /Change /ENABLE /TN"
summary = "Enables one scheduled task by name."
usage = "scheduler.enable <task-name>"
examples = ["scheduler.enable \"MyTask\""]

[[commands]]
name = "scheduler.disable"
run = "schtasks /Change /DISABLE /TN"
summary = "Disables one scheduled task by name."
usage = "scheduler.disable <task-name>"
examples = ["scheduler.disable \"MyTask\""]

[[commands]]
name = "scheduler.delete"
run = "schtasks /Delete /F /TN"
summary = "Deletes one scheduled task by name."
usage = "scheduler.delete <task-name>"
examples = ["scheduler.delete \"MyTask\""]

[[commands]]
name = "scheduler.create"
run = "schtasks /Create"
summary = "Creates a scheduled task using native schtasks switches."
usage = "scheduler.create <schtasks-args>"
examples = ["scheduler.create /TN MyTask /TR notepad.exe /SC DAILY /ST 09:00"]

[[commands]]
name = "scheduler.create.daily"
run = "schtasks /Create /SC DAILY /TN"
summary = "Creates a daily scheduled task. Pass task name, then /TR command and /ST time."
usage = "scheduler.create.daily <task-name> /TR <command> /ST <HH:MM>"
examples = ["scheduler.create.daily MyTask /TR notepad.exe /ST 09:00"]

[[commands]]
name = "scheduler.create.once"
run = "schtasks /Create /SC ONCE /TN"
summary = "Creates a one-time scheduled task. Pass task name, then /TR command, /ST time, and optional /SD date."
usage = "scheduler.create.once <task-name> /TR <command> /ST <HH:MM> [/SD <MM/DD/YYYY>]"
examples = ["scheduler.create.once MyTask /TR notepad.exe /ST 14:30 /SD 05/17/2026"]

[[commands]]
name = "scheduler.create.startup"
run = "schtasks /Create /SC ONSTART /TN"
summary = "Creates a task that runs when Windows starts. Pass task name, then /TR command."
usage = "scheduler.create.startup <task-name> /TR <command>"
examples = ["scheduler.create.startup MyTask /TR notepad.exe"]

[[commands]]
name = "scheduler.raw.create"
run = "schtasks /Create"
summary = "Raw schtasks create command for advanced options."
usage = "scheduler.raw.create <schtasks-args>"
examples = ["scheduler.raw.create /TN MyTask /TR notepad.exe /SC WEEKLY /D MON /ST 09:00"]

[[commands]]
name = "scheduler.raw"
run = "schtasks"
summary = "Runs raw schtasks arguments."
usage = "scheduler.raw <schtasks-args>"
examples = ["scheduler.raw /Query /FO CSV"]

[[commands]]
name = "scheduler.help"
run = "schtasks /?"
summary = "Shows schtasks help."
usage = "scheduler.help"
examples = ["scheduler.help"]
